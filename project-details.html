<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Project Details | jolie_V</title>

    <link
        rel="stylesheet"
        href="css/bootstrap.css">

    <link
        rel="stylesheet"
        href="css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <!-- BACKGROUND -->

    <div id="mosaic-container"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <nav class="navbar navbar-expand-lg bg-body-tertiary w-100">

            <div class="container-fluid">

                <a
                    class="navbar-brand header-logo"
                    href="index.html">
                    jolie_V
                </a>


                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <div
                    class="collapse navbar-collapse"
                    id="navbarNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">

                            <a
                                class="nav-link header-item"
                                href="index.html#about-me">
                                /about_Me
                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link header-item"
                                href="index.html#projects">
                                /projects
                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link header-item"
                                href="index.html#skills">
                                /skills
                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link header-item"
                                href="index.html#contact">
                                /contact
                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>



    <!-- PROJECT DETAILS -->

    <main class="project-details-page">

        <div class="project-details-container">


            <a
                href="index.html#projects"
                class="back-projects">
                ← back_to_projects
            </a>


            <div class="project-details-grid">


                <!-- PROJECT IMAGE -->

                <div class="project-details-image">

                    <img
                        id="project-image"
                        src=""
                        alt="Project">

                </div>


                <!-- PROJECT INFORMATION -->

                <div class="project-details-content">

                    <div class="project-details-label">
                        /project
                    </div>


                    <h1 id="project-title">
                        Project
                    </h1>


                    <div
                        id="project-stack"
                        class="project-details-stack">
                    </div>


                    <p id="project-description">
                    </p>


                    <div class="project-details-section">

                        <h2>
                            /overview
                        </h2>

                        <p id="project-overview">
                        </p>

                    </div>


                    <div class="project-details-section">

                        <h2>
                            /role
                        </h2>

                        <p id="project-role">
                        </p>

                    </div>


                    <div class="project-details-section">

                        <h2>
                            /technologies
                        </h2>

                        <p id="project-technologies">
                        </p>

                    </div>


                    <a
                        id="project-live-link"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="project-live-button">

                        ↗ View Live Page

                    </a>

                </div>

            </div>

        </div>

    </main>


    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/script.js"></script>

    <script src="js/project-details.js"></script>

</body>

</html>
